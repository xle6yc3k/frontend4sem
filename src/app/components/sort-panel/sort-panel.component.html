<mat-form-field appearance="fill" style="width: 250px; margin-bottom: 1rem;">
    <mat-label>Сортировка</mat-label>
    <mat-select (selectionChange)="onSortChange($event.value)" [value]="'default'">
      <mat-option *ngFor="let option of sortOptions" [value]="option.value">
        {{ option.label }}
      </mat-option>
    </mat-select>
  </mat-form-field>
