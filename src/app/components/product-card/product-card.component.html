<mat-card class="product-card" @cardAnimation>
    <img mat-card-image [src]="product.image" [alt]="product.title" />
    <mat-card-content>
      <h3>{{ product.title }}</h3>
      <p>{{ product.description }}</p>
      <h4>{{ product.price }} ₽</h4>
      <button mat-raised-button color="primary" (click)="addToCart()">Добавить в корзину</button>
    </mat-card-content>
  </mat-card>
