<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container">
        <h1 class="text-center my-4">Админ-панель</h1>

        <!-- 📌 Форма для добавления товара -->
        <h3>Добавить товар</h3>
        <form id="productForm">
            <div class="mb-3">
                <label class="form-label">Название</label>
                <input type="text" id="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Цена</label>
                <input type="number" id="price" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Описание</label>
                <textarea id="description" class="form-control" required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Категория (через запятую)</label>
                <input type="text" id="category" class="form-control" required>
            </div>
            <button type="submit" id="submitButton" class="btn btn-success">Добавить товар</button>
        </form>

        <!-- 📌 Таблица товаров -->
        <h3 class="mt-4">Список товаров</h3>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Цена</th>
                    <th>Описание</th>
                    <th>Категория</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="productTable"></tbody>
        </table>
    </div>

    <!-- 📌 Чат -->
    <div class="container mt-5">
        <h2 class="text-center">Чат поддержки (Админ)</h2>
        <div id="chat-box" class="chat-box"></div>
        <div class="chat-input">
            <input type="text" id="chat-message" placeholder="Введите сообщение..." class="form-control">
            <button id="send-message" class="btn btn-primary mt-2">Отправить</button>
        </div>
    </div>

    <style>
        .chat-box {
            height: 300px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
    </style>

    <script src="admin.js"></script>
</body>
</html>
