<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Кэш и Cookie</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Авторизация / Регистрация -->
  <div id="auth-section">
    <h2>Вход</h2>
    <input type="text" id="username" placeholder="Логин">
    <input type="password" id="password" placeholder="Пароль">
    <button id="login-btn">Войти</button>
    <p id="error-message" class="error hidden"></p>
    <h3>Нет аккаунта? Зарегистрируйтесь:</h3>
    <input type="text" id="reg-username" placeholder="Новый логин">
    <input type="password" id="reg-password" placeholder="Новый пароль">
    <button id="register-btn">Зарегистрироваться</button>
  </div>

  <!-- Контент после входа -->
  <div id="profile-section" class="hidden">
    <h2>Профиль</h2>
    <p>Привет, <span id="username-display"></span>!</p>
    <button id="logout-btn">Выйти</button>

    <h1>Демонстрация кэширования</h1>
    <div class="controls">
      <button id="toggle-theme">Сменить тему</button>
      <button id="refresh-data">Обновить данные</button>
    </div>
    <div id="data-container"></div>
  </div>

  <script src="/script.js"></script>
</body>
</html>
