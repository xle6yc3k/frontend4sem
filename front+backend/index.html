<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Auth Demo</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: auto; padding: 2rem; }
    form, button { margin-top: 1rem; }
    input { margin: 0.2rem; padding: 0.5rem; width: 100%; }
    .section { border: 1px solid #ccc; padding: 1rem; margin-bottom: 2rem; border-radius: 6px; }
  </style>
</head>
<body>

  <h1>🛡️ Auth Demo</h1>

  <div class="section">
    <h2>Регистрация</h2>
    <form id="registerForm">
      <input type="text" id="registerUsername" placeholder="Логин" required />
      <input type="password" id="registerPassword" placeholder="Пароль" required />
      <button type="submit">Зарегистрироваться</button>
    </form>
    <p id="registerMessage"></p>
  </div>

  <div class="section">
    <h2>Вход</h2>
    <form id="loginForm">
      <input type="text" id="loginUsername" placeholder="Логин" required />
      <input type="password" id="loginPassword" placeholder="Пароль" required />
      <button type="submit">Войти</button>
    </form>
    <p id="loginMessage"></p>
  </div>

  <div class="section">
    <h2>Защищённые данные</h2>
    <button id="fetchProtectedData">Получить данные профиля</button>
    <pre id="protectedData"></pre>
    <h3>JWT Token:</h3>
<pre id="jwtToken" style="word-break: break-all;"></pre>

  </div>

  <script src="./script.js"></script>
</body>
</html>
